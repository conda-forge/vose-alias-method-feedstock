{% set name = "Vose-Alias-Method" %}
{% set version = "1.2.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') | lower }}-{{ version }}.tar.gz
  sha256: 1333655259733da6241c89e256d75ccd055c326b9e262ec3151c792048b3316b

build:
  number: 0
  noarch: python
  entry_points:
    - vose-sampler=vose_sampler.vose_sampler:main
  script: '{{ PYTHON }} -m pip install . -vv '

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - python >={{ python_min }}


test:
  requires:
    - python {{ python_min }}
  imports:
    - vose_sampler
  commands:
    - vose-sampler --help

about:
  home: https://github.com/asmith26/Vose-Alias-Method.git
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: Python implementation of Vose's alias method, an efficient algorithm for sampling from a discrete probability distribution.
  doc_url: https://github.com/asmith26/Vose-Alias-Method/blob/master/README.md#example-usage
  dev_url: https://github.com/asmith26/Vose-Alias-Method

extra:
  recipe-maintainers:
    - asmith26
